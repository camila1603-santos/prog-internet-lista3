<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 3 - Layout com Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        .grid {
            width: 600px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1.3fr 1fr;
            grid-template-rows: 100px 100px 100px 100px;
            gap: 8px;

            grid-template-areas:
                "b1 b1 b1"
                "b2 b3 b4"
                "b5 b3 b6"
                "b5 b7 b7";
        }

        .bloco {
            background-color: #ffd682;
            border-radius: 6px;
            font-weight: bold;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .vermelho {
            background-color: #f24766;
        }

        .b1 { grid-area: b1; }
        .b2 { grid-area: b2; }
        .b3 { grid-area: b3; }
        .b4 { grid-area: b4; }
        .b5 { grid-area: b5; }
        .b6 { grid-area: b6; }
        .b7 { grid-area: b7; }
    </style>
</head>
<body>
    <div class="grid">
        <div class="bloco b1">1</div>
        <div class="bloco vermelho b2">2</div>
        <div class="bloco b3">3</div>
        <div class="bloco vermelho b4">4</div>
        <div class="bloco b5">5</div>
        <div class="bloco vermelho b6">6</div>
        <div class="bloco b7">7</div>
    </div>
</body>
</html>
