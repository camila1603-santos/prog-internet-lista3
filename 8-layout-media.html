<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 8 - Layout com Media Query</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #e9e9ec;
            padding: 20px;
        }

        .container {
            height: 90vh;
            display: grid;
            grid-template-columns: 50px 1fr 1fr 1fr;
            grid-template-rows: 1fr 1.3fr 1fr;
            gap: 6px;
            background-color: white;
            padding: 6px;

            grid-template-areas:
                "bolinhas azul    azul     laranja"
                "bolinhas marrom  verdeagua laranja"
                "rosa     rosa    verde    verde";
        }

        .bolinhas {
            grid-area: bolinhas;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding-top: 5px;
        }

        .bolinha {
            width: 25px;
            height: 25px;
            border-radius: 50%;
        }

        .azul      { grid-area: azul;      background-color: #b4c6dc; }
        .laranja   { grid-area: laranja;   background-color: #f3a930; }
        .marrom    { grid-area: marrom;    background-color: #d3aaa6; }
        .verdeagua { grid-area: verdeagua; background-color: #c7dedc; }
        .rosa      { grid-area: rosa;      background-color: #f3b4a5; }
        .verde     { grid-area: verde;     background-color: #b9cb72; }

        @media screen and (max-width: 500px) {
            .container {
                height: auto;
                grid-template-columns: 1fr;
                grid-template-rows: 50px 150px 150px 150px 150px 150px 150px;

                grid-template-areas:
                    "bolinhas"
                    "azul"
                    "laranja"
                    "marrom"
                    "verdeagua"
                    "rosa"
                    "verde";
            }

            .bolinhas {
                flex-direction: row;
                justify-content: center;
                padding-top: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="bolinhas">
            <div class="bolinha" style="background-color: #f08a5d;"></div>
            <div class="bolinha" style="background-color: #b9c39a;"></div>
            <div class="bolinha" style="background-color: #cdbde3;"></div>
            <div class="bolinha" style="background-color: #f3961c;"></div>
        </div>
        <div class="azul"></div>
        <div class="laranja"></div>
        <div class="marrom"></div>
        <div class="verdeagua"></div>
        <div class="rosa"></div>
        <div class="verde"></div>
    </div>
</body>
</html>
